<html lang="fr"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	

	<title>Inscription nouveau client - méditerranéee</title>
</head>
<body bgcolor="green" form="" action="#" method="post">
		<h1>Inscription d'un nouveau client </h1>
		<table>
			<tbody><tr><td><label for="nom">Nom:</label></td><td><input type="text" id="nom" name="nom"></td>
		</tr></tbody></table>
		<label for="prenom">Prénom:</label>
		<input type="text" id="prenom" name="prenom">
		<label for="date de naissance">Date de naissance:</label>
		<input type="date" id="date naissance" name="date naissance">
		<br>
		<label for="email">Adresse mail:</label>

		<input type="email" id="email" name="email">
		<br>
<label for="mdp">Mot de passe:</label>
<input type="passeword" id="mdp" name="mdp">

<br>
<label for="permis"> Numéro de permis :</label>
<input type="text" id="permis" name="permis">
<br>
<label for="anciennete">nombre d'années d' ancienneté:</label>
<input type="number" id="ancienneté" name="anciennete" min="0" max="80">
<br>
<label for="ville">ville:</label>
<select id="ville" name="ville">
<option value="paris">Paris</option>
<option value="versailles"> Versailles</option>
<option value="creteil"> Créteil</option>
</select>
<table width="70%" border="0">
	<tbody><tr><td><label for="adresse">Adresse du client:</label></td><td><textarea id="adresse" name="adresse" rows="4" cols="30"></textarea></td></tr>
	</tbody></table>

<p> Situation matrimoniale :</p>
<label for="marie oui">Marié</label><input type="radio" id="marie oui" name="marie" value="oui">


<label for="marie non">Non marié</label>
<input type="radio" id="marie non" name="marie" value="non"> 
<p>Préference de voiture :</p>

<table width="70%" border="0">
	<tbody><tr><td><label for="pref auto"> Automatique</label></td><td><input type="checkbox" id="pref manuelle" name="preference manuelle" value="manuelle"></td></tr> 
	</tbody></table>
<table width="70%" border="0"> 
	<tbody><tr><td><button type="submit">Enregistrer</button></td><td><button type="reset"> Annuler</button></td></tr>
	</tbody></table>	






</body></html>
